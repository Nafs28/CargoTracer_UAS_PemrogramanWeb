services:
  - type: web
    name: cargotrace-uas
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: CargoTrace
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
